<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karan RJ — Portfolio directory</title><meta name="description" content="Karan RJ's projects, public security research, achievements and contact links."><style>
:root{font:17px/1.65 system-ui,sans-serif;color:#19384b;background:#f4f5ee}body{max-width:1000px;margin:0 auto;padding:40px 24px}a{color:#125e70;text-underline-offset:4px}nav{display:flex;gap:22px;flex-wrap:wrap}h1{font-size:clamp(42px,8vw,90px);line-height:1;letter-spacing:-4px;margin-bottom:20px}h2{font-size:32px;margin-top:64px}h3{font-size:24px;margin:0 0 12px}article{padding:25px 0;border-top:1px solid #cad5cb}small{color:#506d7d}p{max-width:75ch}pre{white-space:pre-wrap;font:inherit}a:focus-visible{outline:3px solid #2d8998;outline-offset:5px}.intro{font-size:21px}.links{display:flex;gap:20px;flex-wrap:wrap}
</style></head><body><nav><a href="./">← Explore the Egghead world</a><a href="#projects">Projects</a><a href="#reports">Research</a><a href="#achievements">Achievements</a><a href="#contact">Contact</a></nav><main><h1>Karan RJ.</h1><p class="intro">Security researcher / full-stack developer</p><div id="profile"></div><div id="collections"></div><section id="contact"><h2>Open channel</h2><div class="links" id="links"></div></section><p id="status" role="status">Loading portfolio…</p></main><script type="module">
import{loadContent,safeUrl}from './src/portfolio.js?v=9';
const make=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e;};
const link=(label,url)=>{const a=make('a',label);a.href=url;a.rel='noopener noreferrer';return a;};
try{const d=await loadContent();document.querySelector('#profile').append(make('p',d.site.about));for(const [key,title] of [['projects','Projects'],['reports','Research & reports'],['cves','CVE advisories'],['articles','Articles & writeups'],['achievements','Achievements']]){const section=document.createElement('section');section.id=key;section.append(make('h2',title));for(const item of d[key]){const article=document.createElement('article');article.append(make('small',item.kind||item.date||''),make('h3',item.title),make('p',item.summary||''));if(item.body)article.append(make('pre',item.body));const url=safeUrl(item.url);if(url)article.append(link(key==='projects'?'Open project ↗':'Read source ↗',url));section.append(article);}if(!d[key].length)section.append(make('p','No public entries published yet.'));document.querySelector('#collections').append(section);}document.querySelector('#links').append(link(d.site.email,'mailto:'+d.site.email));for(const key of ['github','linkedin','tryhackme','hackthebox','leetcode','medium']){const u=safeUrl(d.site[key]);if(u)document.querySelector('#links').append(link(key,u));}document.querySelector('#status').textContent='';}catch{document.querySelector('#status').textContent='Content could not load. Please reload or contact rjkaran418@gmail.com.';}
</script></body></html>
